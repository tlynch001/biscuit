[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biscuit"
version = "0.1.0"
description = "Automated AI story-video production pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
    "Pillow>=10.0",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
]
youtube = [
    "google-api-python-client>=2.100,<3",
    "google-auth-httplib2>=0.2,<1",
    "google-auth-oauthlib>=1.2,<2",
]

[project.scripts]
biscuit = "biscuit.cli:main"

[tool.setuptools.packages.find]
include = ["biscuit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
